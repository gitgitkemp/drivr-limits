# Maakt elke maand de Drivr-limiettegels uit OpenStreetMap en zet ze op GitHub Pages.
# Draait volledig in de cloud; niets op je eigen computer.
name: Limiettegels

on:
  schedule:
    - cron: "0 4 3 * *"        # elke maand op de 3e om 04:00 UTC
  workflow_dispatch: {}         # of met de hand starten via het tabblad Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gereedschap installeren
        run: |
          pip install "osmium>=4,<5"
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool

      # Per kaart: downloaden, alleen wegen met een limiet bewaren, het grote bestand meteen weggooien.
      # Zo blijven schijf en geheugen klein, ook voor Duitsland en Frankrijk.
      - name: Kaarten downloaden en voorfilteren (Geofabrik)
        run: |
          mkdir -p osm
          get() {   # get <naam> <geofabrik-pad>
            curl -fsSL -o osm/raw.pbf "https://download.geofabrik.de/europe/$2-latest.osm.pbf"
            osmium tags-filter osm/raw.pbf \
              w/highway=motorway,trunk,primary,secondary,tertiary,unclassified,residential,living_street,service,road,motorway_link,trunk_link,primary_link,secondary_link,tertiary_link \
              -o osm/roads.pbf --overwrite
            osmium tags-filter osm/roads.pbf w/maxspeed w/maxspeed:type w/source:maxspeed w/zone:maxspeed \
              -o "osm/$1.pbf" --overwrite
            rm -f osm/raw.pbf osm/roads.pbf
            ls -lh "osm/$1.pbf"
          }
          get nl netherlands
          get be belgium
          get de germany
          get fr france
          get es spain
          get gb great-britain
          get ie ireland-and-northern-ireland
          df -h .

      - name: Tegels maken
        run: |
          python make_tiles.py site nl=osm/nl.pbf be=osm/be.pbf de=osm/de.pbf fr=osm/fr.pbf es=osm/es.pbf \
            uk=osm/gb.pbf uk=osm/ie.pbf

      - name: Startpagina en vermelding
        run: |
          cp README.md site/README.md
          printf '<!doctype html><meta charset="utf-8"><title>Drivr limieten</title><p>Snelheidslimieten voor de Drivr-app. Data: &copy; OpenStreetMap-bijdragers, ODbL.</p>' > site/index.html
          du -sh site
          # GitHub Pages staat maximaal 1 GB toe
          size=$(du -sm site | cut -f1)
          echo "Totaal: ${size} MB"
          if [ "$size" -gt 980 ]; then echo "::error::Tegels zijn ${size} MB, meer dan GitHub Pages toestaat (1 GB)"; exit 1; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
